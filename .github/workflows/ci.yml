name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Types and content schemas
        run: npm run check
      - name: Spell check
        run: npm run spell
      - name: Build
        run: npm run build
      - name: HTML validation
        run: npm run validate
      - name: Internal link check
        run: npm run links
      - name: Lighthouse CI (95+ in every category)
        run: npm run lhci
      - name: Remaining placeholders
        if: always()
        run: npm run placeholders
